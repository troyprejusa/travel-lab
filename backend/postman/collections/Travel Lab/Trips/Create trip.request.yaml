$kind: http-request
name: Create trip
url: http://localhost:8000/api/v1/trip/
method: POST
auth:
  type: bearer
  credentials:
    token: troy@test.com
body:
  type: formdata
  content:
    - key: destination
      value: "Kyoto"
    - key: start_date
      value: "2026-04-01"
    - key: end_date
      value: "2026-04-08"
    - key: vacation_type
      value: "city"
    - key: description
      value: "Example trip"
