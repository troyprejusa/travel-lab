$kind: http-request
name: Update user
url: http://localhost:8000/api/v1/user/troy@test.com
method: PATCH
auth:
  type: bearer
  credentials:
    token: troy@test.com
body:
  type: formdata
  content:
    - key: first_name
      value: "Troy"
    - key: last_name
      value: "Prejusa"
    - key: phone
      value: "1234567890"
