version: "3"
services:
  api_dev:
    image: ghcr.io/astral-sh/uv:python3.14-bookworm
    container_name: fast_api_dev
    command: /app/startup.sh
    volumes:
      - .:/app
      - ../frontend/dist:/app/src/dist
    ports:
      - "8000:8000"   # For the API
      - "5678:5678"   # For VSCode debugger
    depends_on:
      - database_dev

  database_dev:
    image: postgres:18
    container_name: sql_database
    environment:
      - POSTGRES_USER=docker
      - POSTGRES_PASSWORD=docker
      - POSTGRES_DB=travel_lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  webserver_dev:
    image: nginx
    container_name: nginx_server
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /Users/troyprejusa/Dev/dev-certs/travel-lab-certs:/etc/nginx/certs:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "443:443"
    depends_on:
      - api_dev

