[project]
name = "travel-lab-backend"
version = "0.1.0"
description = "Travel Lab API backend"
requires-python = ">=3.14"
dependencies = [
    "aiohttp",
    "aiosignal",
    "anyio",
    "async-timeout",
    "attrs",
    "auth0-python",
    "bcrypt",
    "bidict",
    "certifi",
    "cffi",
    "charset-normalizer",
    "click",
    "cryptography",
    "debugpy",
    "dnspython",
    "email-validator",
    "exceptiongroup",
    "fastapi",
    "frozenlist",
    "h11",
    "httpcore",
    "httptools",
    "httpx",
    "idna",
    "itsdangerous",
    "Jinja2",
    "MarkupSafe",
    "minio",
    "multidict",
    "orjson",
    "pip-licenses",
    "prettytable",
    "psycopg",
    "psycopg-binary",
    "psycopg-pool",
    "pycparser",
    "pydantic",
    "PyJWT",
    "pyOpenSSL",
    "python-dotenv",
    "python-engineio",
    "python-multipart",
    "python-socketio",
    "PyYAML",
    "requests",
    "sniffio",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette",
    "typing_extensions",
    "ujson",
    "urllib3",
    "uvicorn",
    "uvloop",
    "watchfiles",
    "wcwidth",
    "websockets",
    "yarl",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.5.0",
    "pytest-cov",
    "ruff",
    "testcontainers[postgres]>=4.15.0",
]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E712"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
